name: Build Android APK

# Every push to main builds an APK and publishes it as a GitHub Release.
# On the Thor: open github.com/Beefnasty96/Loot-shoot-/releases/latest and tap LootShoot.apk.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.1"
  HAS_SIGNING_PASSPHRASE: ${{ secrets.SIGNING_PASSPHRASE != '' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Godot + Android templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-android

      - name: Download Godot + export templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          V="$GODOT_VERSION"
          BASE="https://github.com/godotengine/godot/releases/download/${V}-stable"
          TDIR="$HOME/.local/share/godot/export_templates/${V}.stable"
          mkdir -p ~/godot "$TDIR"
          cd ~/godot
          curl -sSLo godot.zip "$BASE/Godot_v${V}-stable_linux.x86_64.zip"
          unzip -q godot.zip && rm godot.zip
          mv "Godot_v${V}-stable_linux.x86_64" godot
          curl -sSLo templates.tpz "$BASE/Godot_v${V}-stable_export_templates.tpz"
          # Only the Android templates are needed; keeps the cache small.
          unzip -q templates.tpz 'templates/android_*' 'templates/version.txt'
          mv templates/* "$TDIR/" && rm -rf templates templates.tpz
          ls -la "$TDIR"

      - name: Point Godot at the Android SDK and Java
        run: |
          set -euo pipefail
          MM=$(echo "$GODOT_VERSION" | cut -d. -f1,2)
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-${MM}.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          EOF
          cat ~/.config/godot/editor_settings-${MM}.tres

      # Same signing key every build, so new APKs install over old ones.
      # Permanent storage: signing/keystore.tar.enc in the repo, encrypted (AES-256,
      # PBKDF2) with the SIGNING_PASSPHRASE repo secret. Until that secret exists,
      # the key lives in the Actions cache (cleared after 7 days without builds).
      - name: Restore signing key
        uses: actions/cache@v4
        with:
          path: ~/keystore
          key: lootshoot-signing-key-v1

      - name: Prepare signing key
        env:
          PASSPHRASE: ${{ secrets.SIGNING_PASSPHRASE }}
        run: |
          set -euo pipefail
          mkdir -p ~/keystore
          if [ -f signing/keystore.tar.enc ] && [ -n "${PASSPHRASE}" ]; then
            echo "Using the permanent signing key from the repo."
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -pass env:PASSPHRASE \
              -in signing/keystore.tar.enc | tar -x -C ~/keystore
          elif [ -f signing/keystore.tar.enc ]; then
            echo "::warning::signing/keystore.tar.enc exists but SIGNING_PASSPHRASE is not set; falling back to the cached key."
          fi
          if [ ! -f ~/keystore/release.keystore ]; then
            echo "No signing key yet: generating one (cached for future builds)."
            openssl rand -hex 16 | tr -d '\n' > ~/keystore/pass
            keytool -genkeypair -keystore ~/keystore/release.keystore -alias lootshoot \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$(cat ~/keystore/pass)" -keypass "$(cat ~/keystore/pass)" \
              -dname "CN=Loot Shoot, O=Beefnasty96"
          fi
          PASS="$(cat ~/keystore/pass)"
          echo "::add-mask::${PASS}"
          {
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$HOME/keystore/release.keystore"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=lootshoot"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=${PASS}"
          } >> "$GITHUB_ENV"

      # One time only: once SIGNING_PASSPHRASE is set, lock the current key into the
      # repo (encrypted) so it survives cache clears. Commit is marked [skip ci].
      - name: Save signing key permanently
        env:
          PASSPHRASE: ${{ secrets.SIGNING_PASSPHRASE }}
        if: ${{ env.HAS_SIGNING_PASSPHRASE == 'true' && hashFiles('signing/keystore.tar.enc') == '' }}
        run: |
          set -euo pipefail
          if [ ${#PASSPHRASE} -lt 20 ]; then
            echo "::error::SIGNING_PASSPHRASE must be at least 20 characters."; exit 1
          fi
          mkdir -p signing
          tar -c -C ~/keystore release.keystore pass | \
            openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt -pass env:PASSPHRASE -out signing/keystore.tar.enc
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add signing/keystore.tar.enc
          git commit -m "Store encrypted signing key [skip ci]"
          git push
          echo "Signing key saved permanently."

      - name: Import settings for uploaded textures
        run: python3 tools/textures/import_presets.py assets/textures

      - name: Import project
        run: ~/godot/godot --headless --import

      - name: Export APK
        run: |
          set -euo pipefail
          mkdir -p build
          ~/godot/godot --headless --export-release "Android" build/LootShoot.apk 2>&1 | tee export.log
          test -s build/LootShoot.apk || { echo "APK was not created"; exit 1; }
          ls -la build

      - uses: actions/upload-artifact@v4
        with:
          name: LootShoot-apk
          path: build/LootShoot.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Test build ${{ github.run_number }}
          body: |
            ${{ github.event.head_commit.message }}

            Install: tap LootShoot.apk below on your Thor (allow installs from your browser if asked).
          files: build/LootShoot.apk
          make_latest: true
